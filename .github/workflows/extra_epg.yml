name: Generate Extra EPG

on:
  schedule:
    - cron: '0 3 * * *' # दररोज सकाळी ३ वाजता रन होईल
  workflow_dispatch: # हाताने (Manual) पण रन करता येईल

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run EPG Generator Script
        run: node extra_epg.js

      - name: Commit and Push EPG
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add epg/extra_epg.xml.gz
          git commit -m "Auto-update Extra EPG (Samsung & MAC)" || exit 0
          git push
          
