name: Generate EPG via Python

on:
  schedule:
    - cron: '0 */6 * * *' # दर ६ तासांनी ऑटोमॅटिक रन होईल
  workflow_dispatch: # मॅन्युअल रन करण्यासाठी

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Python EPG Script
        run: python master_epg.py

      - name: Commit and Push XML
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "EPG Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add Cache/epg.xml
          git commit -m "Auto-update EPG XML: $(date -u)" || echo "No changes to commit"
          git push
          
