name: Generate Master EPG

on:
  schedule:
    - cron: '0 3 * * *' # दररोज सकाळी ३ वाजता ऑटोमॅटिक रन होईल
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Master EPG Generator
        run: node master_epg.js

      - name: Commit and Push EPG
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add epg/tataplay.xml.gz epg/channels_report.json
          git commit -m "Auto-update Master EPG (TataPlay + JioTV + Samsung + MAC)" || exit 0
          git push
          
