name: Generate Tata Play EPG

on:
  schedule:
    - cron: '0 0 * * *' # दररोज रात्री १२ वाजता ऑटोमॅटिक रन होईल
  workflow_dispatch: # मॅन्युअली रन करण्यासाठी

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install axios dayjs

      - name: Run EPG Generator Script
        run: node watch.tataplay.com.js # टीप: जर तुमच्या फाईलचे नाव watch.tataplay.js असेल तर खालीलप्रमाणे watch.tataplay.js ठेवा

      - name: Commit and Push EPG
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add guide.xml
          git commit -m "Auto-update Tata Play EPG (5 Days) [skip ci]" || exit 0
          git push
          
