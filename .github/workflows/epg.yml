name: Generate Tata Play EPG

on:
  schedule:
    - cron: '0 0 * * *' # दररोज रात्री १२ वाजता ऑटोमॅटिक रन होईल
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # वर्कफ्लो १ तास चालू राहू शकतो

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install axios dayjs

      - name: Run EPG Generator Script
        run: node watch.tataplay.js

      - name: Commit and Push EPG
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git stash || true
          git pull origin main --rebase || true
          git stash pop || true
          git add epg/tataplay.xml epg/tataplay.xml.gz epg/channels_report.json
          git commit -m "Auto-update 3-Day Tata Play EPG & Report [skip ci]" || exit 0
          git push origin main
          
